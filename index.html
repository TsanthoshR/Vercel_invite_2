<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theodosia &amp; Santhosh</title>
<meta name="description" content="Wedding of Theodosia and Santhosh, Monday 28 December 2026, Nagercoil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #fbf8f1;
    --paper: #f5efe2;
    --ink: #3a3a33;
    --muted: #6b6a5d;
    --sage: #8a9a84;
    --gold: #b8924a;
    --line: #d8c9a6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ivory: #1f2420; --paper: #262c26; --ink: #efe8d6; --muted: #bdb59b;
      --sage: #9db095; --gold: #d8b06a; --line: #4a4a3c;
    }
  }
  :root[data-theme="dark"] {
    --ivory: #1f2420; --paper: #262c26; --ink: #efe8d6; --muted: #bdb59b;
    --sage: #9db095; --gold: #d8b06a; --line: #4a4a3c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ivory);
    color: var(--ink);
    font-family: 'Jost', system-ui, sans-serif;
    font-weight: 300;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1rem;
    overflow-x: hidden;
  }
  main {
    width: 100%;
    max-width: 520px;
    text-align: center;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 3rem 1.5rem 2.5rem;
    position: relative;
  }
  main::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid var(--line);
    pointer-events: none;
  }
  .cross { width: 22px; height: 30px; color: var(--gold); margin: 0 auto 1rem; display: block; }
  .lead {
    font-size: 0.85rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    line-height: 1.05;
    margin: 0.6rem 0 0;
  }
  .amp {
    display: block;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    color: var(--gold);
    font-size: 1.8rem;
    line-height: 1.2;
    margin: 0.1rem 0;
  }
  .verse {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 1.35rem;
    color: var(--sage);
    margin: 2rem auto 0;
    max-width: 22ch;
    line-height: 1.35;
  }
  .rule {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 2rem auto;
  }
  .event-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 2rem;
    margin: 0;
  }
  .event-date {
    font-size: 1.05rem;
    font-weight: 400;
    margin: 0.4rem 0 0;
    letter-spacing: 0.02em;
  }
  .event-time {
    color: var(--muted);
    margin: 0.2rem 0 0;
  }
  .venue {
    margin: 1.6rem 0 0;
  }
  .venue-label {
    display: block;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.25rem;
    font-weight: 500;
  }
  .venue-sub {
    display: block;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .map-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    margin-top: 0.8rem;
    padding: 0.5rem 1.1rem;
    border: 1px solid var(--gold);
    color: var(--gold);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    border-radius: 999px;
  }
  .map-btn:hover, .map-btn:focus-visible { background: var(--gold); color: var(--ivory); }
  .map-btn svg { width: 16px; height: 16px; }
  .after {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--line);
  }
  .dress {
    margin: 2rem 0 0;
    font-size: 0.95rem;
    color: var(--muted);
  }
  footer {
    margin-top: 2rem;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  @media (max-width: 380px) {
    main { padding: 2.4rem 1.1rem 2rem; }
  }
</style>
</head>
<body>
<main>
  <svg class="cross" viewBox="0 0 22 30" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
    <path d="M11 1v28M3 10h16"/>
  </svg>
  <p class="lead">Together with their families</p>
  <h1>Theodosia<span class="amp">&amp;</span>Santhosh</h1>

  <p class="verse">&ldquo;Love is beautiful, love is kind.&rdquo;</p>

  <div class="rule"></div>

  <h2 class="event-name">The Wedding</h2>
  <p class="event-date">Monday, 28 December 2026</p>
  <p class="event-time">Time to follow</p>

  <div class="venue">
    <span class="venue-label">Our Lady of Annunciation Church</span>
    <span class="venue-sub">Nagercoil, Tamil Nadu</span>
    <a class="map-btn" href="https://maps.app.goo.gl/wa9dnhxw2aCehfdC8" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>Open in Maps</span>
    </a>
  </div>

  <div class="after venue">
    <span class="venue-label">Reception</span>
    <a class="map-btn" href="https://maps.app.goo.gl/v1c6CdgpNPeCHyeB7?g_st=iw" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>Open in Maps</span>
    </a>
  </div>


  <footer>Theodosia &amp; Santhosh</footer>
</main>
</body>
</html>
